<!DOCTYPE html>
<html lang="en">

<head>
  <!--Fonts Start-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<!--Fonts End-->
<!--Links CSS -->
<link rel="stylesheet" href="CSS/normalize.css">
<link rel="stylesheet" href="CSS/style.css">


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFT Card</title>
</head>

<body>
  <main class="main">
    <div class="card">
      <div class="effect">
        <img src="Photos/image-equilibrium.jpg" alt="equilibrium" class="equilibrium">
        <span></span>
        <img src="Photos/icon-view.svg" alt="" class="eye">
      </div>
      <h1>Equilibrium #3429</h1>
      <p>Our Equilibrium collection promotes balance and calm.</p>
      <div class="icons">
        <div class="first icon">
          <img src="Photos/icon-ethereum.svg" alt="icon ethereum"/>
          <span>0.041 ETH</span>
        </div>
        <div class="second icon">
          <img src="Photos/icon-clock.svg" alt="icon clock" />
          <span>3 days left</span>
        </div>
      </div>
      <hr>
      <img src="Photos/image-avatar.png" alt="Jules Wyvern" class="avatar">
      <span><span class="part-one">Creation of</span> <span class="part-two">Jules Wyvern</span></span>
    </div>
  </main>
</body>

</html>
